specVersion: 1.0.0
description: Weir — perpetual endowments for autonomous agents. Indexes committed principal and every yield release.
repository: https://github.com/Leihyn/weir
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Weir
    network: base-sepolia
    source:
      address: "0xE8b6f6C5cF6dB470c3a3Fe18a1977e55aC0Eb645"
      abi: Weir
      startBlock: 46762240
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/weir.ts
      entities: [Endowment, Harvest, Agent, Protocol]
      abis:
        - name: Weir
          file: ./abis/Weir.json
      eventHandlers:
        - event: EndowmentOpened(indexed uint256,indexed address,indexed address,address,uint256,uint256,uint256,uint64)
          handler: handleOpened
        - event: Harvested(indexed uint256,indexed address,address,uint256,uint256,uint256,uint256)
          handler: handleHarvested
          receipt: false
        - event: ToppedUp(indexed uint256,uint256,uint256)
          handler: handleToppedUp
        - event: AgentChanged(indexed uint256,indexed address,indexed address)
          handler: handleAgentChanged
        - event: RuleChanged(indexed uint256,uint256,uint64)
          handler: handleRuleChanged
        - event: EndowmentClosed(indexed uint256,indexed address,uint256)
          handler: handleClosed
