[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
base = "${BASE_RPC_URL}"

# Public Base RPCs rate-limit heavily on fork tests. drpc.org served archive reads
# at the pinned block reliably; override with BASE_RPC_URL for a private endpoint.
